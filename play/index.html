<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>올웨이즈 전시 영상</title>
<!--
  올웨이즈 전시 — 녹화 영상 재생판
  화면(UI·AR 표시)과 소리를 미리 녹화해 둔 영상을 그대로 튼다. 아이패드가 장면을 직접 그리지 않으므로 끊김·어긋남이 없다.
    아이패드 창 : /play/            → 아이패드 비율 영상(ipad.mp4), 소리 있음, 시간 기준
    아이패드 창(비교용) : /play/?full → 화면을 꽉 채운 아이패드 영상(ipad_full.mp4), 나머지는 같음
    안경 창     : /play/?glasses    → 16:9 영상(glasses.mp4), 소리 없음, 아이패드 창 시간에 맞춰 따라감
  두 창은 같은 사파리 안에서 BroadcastChannel 로 이어진다.
  처음 한 번 인터넷이 될 때 열면 영상을 기기에 저장해 두고, 그 뒤엔 인터넷 없이 재생한다.
  조작: 화면을 누르면 시작(소리·전체 화면) · 1.5초 길게 누르면 처음부터
  화면 맞추기: 그림은 자르지 않고 화면 안에 전부 보이게. ?debug 를 붙이면 화면 크기 · 여백이 보이고, ?inset=2 를 붙이면 가장자리에서 2%씩 안으로 들인다.
-->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  /* 무대(#stage)가 화면 전체를 덮고, 영상 크기는 CSS가 무대 크기(cqw·cqh)로 직접 계산한다.
     전체 화면으로 바뀌어도 브라우저가 다시 배치하면서 바로 맞춰진다(자바스크립트 계산 시점에 의존하지 않음). */
  #stage { position: fixed; inset: 0; overflow: hidden; background: #000; container-type: size; }
  #stage video { position: absolute; object-fit: fill; background: #000;
    --wc: min(calc(100cqw * var(--k, 1)), calc(100cqh * var(--a, 1.334) * var(--k, 1)));
    width: calc(var(--wc) * var(--fx, 1)); height: calc(var(--wc) * var(--fy, .75));
    left: calc((100cqw - var(--wc) * var(--fx, 1)) / 2);
    top: calc((100cqh - var(--wc) / var(--a, 1.334)) / 2 - var(--wc) * var(--oy, 0)); }
  #dbg { position: fixed; right: 10px; top: 10px; z-index: 9; padding: 8px 12px; border-radius: 10px; background: rgba(0,0,0,.75); color: #0f0;
         font: 600 13px/1.5 ui-monospace, Menlo, monospace; white-space: pre; pointer-events: none; }
  #tap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
         background: rgba(0,0,0,.55); color: #fff; font: 600 24px -apple-system, system-ui, sans-serif; transition: opacity .4s; }
  #tap small { font-weight: 500; font-size: 15px; opacity: .7; }
  #st { position: fixed; left: 14px; bottom: 12px; padding: 6px 12px; border-radius: 14px; background: rgba(0,0,0,.5);
        color: rgba(255,255,255,.85); font: 600 12px -apple-system, system-ui, sans-serif; pointer-events: none; transition: opacity .6s; }
</style>
</head><body>
<div id="stage"><video id="v" playsinline webkit-playsinline preload="auto" loop disableremoteplayback disablepictureinpicture x-webkit-airplay="deny"></video></div>
<div id="tap">화면을 누르면 시작합니다<small>1.5초 길게 누르면 처음부터</small></div>
<div id="st" hidden></div>
<div id="dbg" hidden></div>
<script>
(function () {
  var GL = /[?&]glasses\b/.test(location.search);
  var FULL = /[?&]full\b/.test(location.search);
  var FILE = GL ? "glasses.mp4" : FULL ? "ipad_full.mp4" : "ipad.mp4";
  var VER = "7";                                 // 영상을 바꾸면 올린다 — 기기에 저장된 예전 영상을 새로 받게
  var BUILD = "7.3";                             // 페이지를 고칠 때마다 올린다 — 예전 페이지가 떠 있으면 스스로 새로고침
  var STORE = "olw-play-" + VER;
  var v = document.getElementById("v"), tap = document.getElementById("tap"), st = document.getElementById("st");
  var verLine = "<small style='font-size:12px;opacity:.5'>버전 " + BUILD + " · " + FILE + "</small>";
  tap.insertAdjacentHTML("beforeend", verLine);

  /* 예전 페이지가 저장본으로 떠 있으면(인터넷이 느릴 때 등) 최신 페이지를 확인해 한 번 새로고침 */
  if (navigator.onLine) fetch(location.pathname + "?h=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.ok ? r.text() : ""; }).then(function (t) {
    var m = t.match(/var BUILD = "([^"]+)"/);
    if (!m || m[1] === BUILD) return;
    var k = "olw-reload-" + m[1];
    try { if (sessionStorage.getItem(k)) return; sessionStorage.setItem(k, "1"); } catch (_) {}
    location.reload();
  }).catch(function () {});
  var ch = null; try { ch = new BroadcastChannel("olw-play"); } catch (_) {}

  /* 화면 맞추기 — 영상 속 그림(검은 띠 제외)이 화면 안에 "전부" 들어오게 맞춘다. 그림은 절대 자르지 않는다.
     화면 비율이 그림과 같으면(12.9 전체 화면) 꽉 차고, 다르면(주소창이 보일 때 등) 남는 쪽에만 검은 여백이 생긴다.
     ipad.mp4는 2732×2048 틀 안에 그림이 2732×1906(위 72px · 아래 70px 검은 띠)으로 들어 있어, 띠는 화면 밖으로 밀어낸다.
     ?inset=2 → 가장자리에서 2%씩 안쪽으로(케이스 · 둥근 모서리에 가릴 때) / ?debug → 화면 크기와 잘림 여부 표시 */
  var FR = GL ? [1920, 1080, 0, 1080] : FULL ? [2732, 2048, 0, 2048] : [2732, 2048, 72, 1906];   // 틀 너비, 틀 높이, 그림 위 y, 그림 높이
  var INSET = Math.min(20, Math.max(0, parseFloat((location.search.match(/[?&]inset=([\d.]+)/) || [])[1]) || 0)) / 100;
  var DBG = /[?&]debug\b/.test(location.search), dbg = document.getElementById("dbg");
  var stage = document.getElementById("stage"), CQ = window.CSS && CSS.supports && CSS.supports("width", "1cqw");
  var vs = v.style;
  vs.setProperty("--a", FR[0] / FR[3]); vs.setProperty("--fx", 1); vs.setProperty("--fy", FR[1] / FR[0]);
  vs.setProperty("--oy", FR[2] / FR[0]); vs.setProperty("--k", 1 - 2 * INSET);
  function fit() {                     // 컨테이너 단위를 못 쓰는 옛 브라우저만 자바스크립트로 맞춘다
    if (CQ) return;
    var W = stage.clientWidth, H = stage.clientHeight;
    var sc = Math.min(W / FR[0], H / FR[3]) * (1 - 2 * INSET);
    vs.width = FR[0] * sc + "px"; vs.height = FR[1] * sc + "px";
    vs.left = (W - FR[0] * sc) / 2 + "px"; vs.top = (H - FR[3] * sc) / 2 - FR[2] * sc + "px";
  }
  function refit() { fit(); [100, 400, 1000].forEach(function (t) { setTimeout(fit, t); }); }
  fit(); addEventListener("resize", refit); v.addEventListener("loadedmetadata", refit);
  document.addEventListener("fullscreenchange", refit); document.addEventListener("webkitfullscreenchange", refit);
  addEventListener("orientationchange", refit);
  if (window.visualViewport) visualViewport.addEventListener("resize", refit);
  /* ?debug — 지금 실제로 보이는 크기를 1초마다 재서 그림이 화면 밖으로 나갔는지 표시 */
  if (DBG) setInterval(function () {
    var S = stage.getBoundingClientRect(), R = v.getBoundingClientRect(), sc = R.width / FR[0];
    var cx0 = R.left, cx1 = R.right, cy0 = R.top + FR[2] * sc, cy1 = cy0 + FR[3] * sc;
    var cut = [Math.max(0, S.left - cx0), Math.max(0, cx1 - S.right), Math.max(0, S.top - cy0), Math.max(0, cy1 - S.bottom)].map(Math.round);
    var fs = !!(document.fullscreenElement || document.webkitFullscreenElement);
    dbg.hidden = false;
    dbg.textContent = "버전 " + BUILD + " · " + FILE + (v.videoWidth ? " " + v.videoWidth + "×" + v.videoHeight : "") +
      "\n화면 " + Math.round(S.width) + "×" + Math.round(S.height) + " (창 " + innerWidth + "×" + innerHeight + ", 화면 " + screen.width + "×" + screen.height + ")" +
      "\n전체 화면 " + (fs ? "켜짐" : "꺼짐") + " · 계산 " + (CQ ? "CSS" : "JS") +
      "\n그림 표시 " + Math.round(cx1 - cx0) + "×" + Math.round(cy1 - cy0) + " · 여백 좌우 " + Math.round(cx0 - S.left) + " 위아래 " + Math.round(cy0 - S.top) +
      "\n" + (cut.some(Boolean) ? "잘림 있음 — 좌 " + cut[0] + " 우 " + cut[1] + " 위 " + cut[2] + " 아래 " + cut[3] : "잘림 없음") + (INSET ? " · 안쪽 " + INSET * 100 + "%" : "");
  }, 1000);

  function status(t, hideMs) { st.textContent = t; st.hidden = false; st.style.opacity = 1; if (hideMs) setTimeout(function () { st.style.opacity = 0; }, hideMs); }

  /* 영상 — 기기에 저장돼 있으면 메모리에서, 없으면 인터넷에서 틀고 뒤에서 저장 */
  var abs = new URL(FILE, location.href).href;
  function setSrc(u) { var t = v.currentTime; v.src = u; if (t) v.currentTime = t; }
  (window.caches ? caches.open(STORE).then(function (c) { return c.match(abs); }) : Promise.resolve(null))
    .then(function (r) { return r ? r.blob() : null; })
    .then(function (b) {
      if (b && b.size > 1e6) { setSrc(URL.createObjectURL(b)); return; }
      setSrc(abs);
      if (!window.caches) return;
      status("오프라인용 영상 저장 중…");
      fetch(abs + "?h=" + VER, { cache: "no-store" }).then(function (r) {
        if (!r.ok) throw 0;
        return caches.open(STORE).then(function (c) { return c.put(abs, r); });
      }).then(function () {
        status("오프라인 준비 완료 · 인터넷 없이도 재생돼요", 5000);
        caches.keys().then(function (ks) { ks.forEach(function (k) { if (/^olw-play-/.test(k) && k !== STORE) caches.delete(k); }); });
      }).catch(function () { status("영상 저장 실패 · 인터넷 연결 후 새로고침해 주세요", 12000); });
    }).catch(function () { setSrc(abs); });

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});

  function fullscreen() {
    var el = document.documentElement, d = document;
    if (d.fullscreenElement || d.webkitFullscreenElement) return;
    var f = el.requestFullscreen || el.webkitRequestFullscreen;
    if (f) try { var p = f.call(el); p && p.catch && p.catch(function () {}); } catch (_) {}
  }
  function awake() { try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(function () {}); } catch (_) {} }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) awake(); });

  var started = false;
  function start() {
    if (started) return;
    started = true;
    tap.style.opacity = 0; setTimeout(function () { tap.remove(); }, 400);
    v.muted = GL;                     // 소리는 아이패드 창 하나에서만
    v.play().catch(function () { v.muted = true; v.play().catch(function () {}); });
    awake();
  }
  function restart() { v.currentTime = 0; v.play().catch(function () {}); post({ t: "restart" }); }

  /* 누르기: 시작 · 전체 화면 / 길게 누르기: 처음부터 */
  var hold = null;
  addEventListener("pointerdown", function () { hold = setTimeout(function () { hold = null; if (!GL) restart(); }, 1500); });
  addEventListener("pointerup", function () { if (hold) clearTimeout(hold); fullscreen(); start(); if (!GL && v.muted && started) { v.muted = false; } });
  addEventListener("contextmenu", function (e) { e.preventDefault(); });

  function post(m) { try { ch && ch.postMessage(m); } catch (_) {} }

  if (!GL) {
    /* 아이패드 창 — 시간 기준. 0.25초마다 지금 위치를 알린다 */
    setInterval(function () { post({ t: "tick", c: v.currentTime, p: v.paused, n: Date.now() }); }, 500);
  } else {
    /* 안경 창 — 소리 없이 자동 재생, 아이패드 창 시간을 따라간다 */
    tap.innerHTML = "안경 화면 · 아이패드 창을 따라 재생합니다" + verLine;
    v.muted = true;
    v.addEventListener("loadeddata", function () { if (!started) start(); }, { once: true });
    var lastSeek = 0;
    if (ch) ch.onmessage = function (ev) {
      var m = ev.data || {};
      if (m.t === "restart") { v.currentTime = 0; return; }
      if (m.t !== "tick" || !v.duration) return;
      if (m.p) { if (!v.paused) v.pause(); if (Math.abs(v.currentTime - m.c) > 0.1) v.currentTime = m.c; return; }
      var want = (m.c + (Date.now() - m.n) / 1000) % v.duration;
      if (v.paused) v.play().catch(function () {});
      var d = want - v.currentTime;
      if (d > v.duration / 2) d -= v.duration; else if (d < -v.duration / 2) d += v.duration;   // 반복 경계
      /* 재생 속도는 건드리지 않는다(사파리에서 속도를 바꾸면 화면이 미세하게 끊긴다).
         0.5초 넘게 벌어졌을 때만 위치를 한 번 맞추고, 맞춘 뒤 3초는 그대로 둔다 */
      var now = Date.now();
      if (Math.abs(d) > 0.5 && now - lastSeek > 3000 && !v.seeking) { lastSeek = now; v.currentTime = want + 0.05; }
    };
  }
})();
</script>
</body></html>

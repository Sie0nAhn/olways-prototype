<meta charset="utf-8">
<title>olways 전시 가이드</title>
<style>
/* Layout: the Figma board itself, scaled to the screen width; each card is a live layer that moves on scroll. */
:root{--dark:#011722;--pri:#1FACF4;--pri-l:#71CBF8;--ink:#14191C;--navh:64px;--k:1;color-scheme:light;
  --f-suit:"SUIT","Apple SD Gothic Neo",sans-serif;--f-gsf:"Google Sans Flex","SUIT",sans-serif}
@font-face{font-family:"SUIT";font-weight:100 900;font-display:swap;src:url(fonts/suit.woff2) format("woff2-variations"),url(fonts/suit.woff2) format("woff2")}
@font-face{font-family:"Google Sans Flex";font-weight:1 1000;font-display:swap;src:url(fonts/gsf-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2191,U+2193,U+2212}
*{box-sizing:border-box}
html{background:var(--dark)}
body{margin:0;background:#F4F5F7;color:var(--ink);font-family:var(--f-suit);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--pri);outline-offset:3px;border-radius:12px}
img,video{display:block}

/* ---------- NAV ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:rgba(244,245,247,.8)}
.nav{position:fixed;z-index:80;top:env(safe-area-inset-top,0px);left:0;right:0;height:var(--navh);display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));pointer-events:none;transition:transform .5s cubic-bezier(.2,.75,.15,1)}
.nav.hide{transform:translateY(-110%)}
.nav > *{pointer-events:auto}
.groups{display:flex;align-items:center;gap:2px;height:44px;padding:4px 6px 4px 14px;border-radius:22px;background:rgba(236,238,241,.8);-webkit-backdrop-filter:saturate(1.6) blur(20px);backdrop-filter:saturate(1.6) blur(20px);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 2px 14px rgba(255,255,255,.6),0 6px 24px rgba(3,40,58,.08);transition:background .5s,box-shadow .5s}
.groups .lg{width:62px;color:#03283A;margin-right:10px;display:flex;transition:color .5s}
.groups .lg svg{width:100%;height:auto}
.gl{height:36px;padding:0 13px;border-radius:18px;font-family:var(--f-gsf);font-size:14px;font-weight:500;color:rgba(20,25,28,.5);transition:color .35s,background .35s,box-shadow .35s}
.gl.on{color:var(--ink);background:#fff;box-shadow:inset 0 2px 10px rgba(255,255,255,.9),0 2px 8px rgba(3,40,58,.08)}
.rt{display:flex;align-items:center;gap:8px}
.now{height:44px;padding:0 18px;border-radius:22px;background:#14191C;color:#fff;display:flex;align-items:center;gap:10px;font-family:var(--f-gsf);font-size:14px;font-weight:500;box-shadow:inset 0 2px 14px rgba(255,255,255,.14),0 8px 20px rgba(3,40,58,.18);white-space:nowrap;transition:background .5s,color .5s}
.now i{font-style:normal;opacity:.5;font-size:12px}
.go{position:relative;width:44px;height:44px;border-radius:50%;background:#14191C;color:#fff;display:grid;place-items:center;box-shadow:inset 0 2px 14px rgba(255,255,255,.14),0 8px 20px rgba(3,40,58,.18);transition:background .5s,color .5s,transform .2s}
.go:active{transform:scale(.92)}
.go svg.ar{width:16px;height:16px;transform:rotate(90deg)}
.go svg.ring{position:absolute;inset:3px;width:38px;height:38px;transform:rotate(-90deg)}
.go svg.ring circle{fill:none;stroke:rgba(255,255,255,.9);stroke-width:2;stroke-dasharray:113;stroke-dashoffset:calc(113 - 113 * var(--prog,0));stroke-linecap:round}
body.dk .groups{background:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 2px 14px rgba(255,255,255,.06)}
body.dk .groups .lg{color:#fff}
body.dk .gl{color:rgba(255,255,255,.55)}
body.dk .gl.on{color:var(--dark);background:#fff}
body.dk .now,body.dk .go{background:#fff;color:var(--dark)}
body.dk .go svg.ring circle{stroke:var(--pri)}
body.dk::before{background:rgba(1,23,34,.6)}

/* ---------- BOARD ---------- */
.fs{position:relative;width:100%;overflow:hidden}
.plate{position:absolute;left:0;top:0;width:100%;height:100%}
section:not(#s01cover):not(#s02overview) > .plate{top:-3%;height:106%;object-fit:cover}
.b{position:absolute}
.b > img{width:100%;height:100%}
.b.vid{border-radius:calc(24 / 1400 * 100vw);overflow:hidden;background:#0A2230;box-shadow:0 calc(30/1400*100vw) calc(60/1400*100vw) rgba(3,40,58,.25)}
.b.vid video{width:100%;height:100%;object-fit:cover}
.live{position:absolute;left:1.6%;top:3%;display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:10px;background:rgba(1,23,34,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font-family:var(--f-gsf);font-size:11px;font-weight:600;letter-spacing:.08em}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#FF5A4F;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}

/* cover */
.cvw{position:absolute;inset:0;overflow:hidden}
.cvw .plate{transform-origin:50% 60%}
/* overview video */
.ovv{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;filter:blur(8px) brightness(.42) saturate(.85)}
.ovt{position:absolute;inset:0;background:radial-gradient(90% 80% at 50% 50%,rgba(1,23,34,.35),rgba(1,23,34,.75))}

/* spotlight + badges */
.spot{position:absolute;pointer-events:none;border-radius:calc(24/1400*100vw);background:radial-gradient(circle at var(--sx,50%) var(--sy,50%),rgba(1,23,34,0) 0,rgba(1,23,34,0) calc(70/1400*100vw),rgba(1,23,34,.55) calc(200/1400*100vw));opacity:0;transition:opacity .6s,--sx .9s cubic-bezier(.2,.75,.15,1),--sy .9s cubic-bezier(.2,.75,.15,1)}
.spot.on{opacity:1}
@property --sx{syntax:"<percentage>";inherits:false;initial-value:50%}
@property --sy{syntax:"<percentage>";inherits:false;initial-value:50%}
.bdg{position:absolute;width:calc(56/1400*100vw);height:calc(56/1400*100vw);margin:calc(-28/1400*100vw) 0 0 calc(-28/1400*100vw);border-radius:50%}
.bdg::after{content:"";position:absolute;inset:18%;border-radius:50%;border:2px solid rgba(113,203,248,.9);opacity:0;transform:scale(.6)}
.bdg.on::after{animation:ping 1.6s infinite}
@keyframes ping{0%{opacity:1;transform:scale(.6)}100%{opacity:0;transform:scale(1.9)}}
.cring{position:absolute;pointer-events:none;border-radius:calc(20/1400*100vw);box-shadow:0 0 0 2px rgba(31,172,244,0),0 0 0 rgba(31,172,244,0);transition:box-shadow .5s,transform .5s}
.cring.on{box-shadow:0 0 0 2px #1FACF4,0 calc(14/1400*100vw) calc(30/1400*100vw) rgba(31,172,244,.35);transform:translateY(calc(-6/1400*100vw))}

/* solution cards (authored in Figma px, scaled) */
.b.html{overflow:visible}
.fx{transform-origin:0 0;transform:scale(var(--k));display:flex;gap:16px;position:absolute;left:0;top:0}
.scard{position:relative;flex:none;width:592px;height:443px;border-radius:24px;padding:24px 28px;color:#fff;display:flex;flex-direction:column;gap:6px;
  background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 2px 30px rgba(255,255,255,.06),0 20px 40px rgba(0,10,20,.25);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12)}
.sh{display:flex;align-items:baseline;gap:10px}
.sh b{font-size:20px;font-weight:700}
.sh span{font-family:var(--f-gsf);font-size:13px;color:rgba(255,255,255,.5)}
.st{margin:10px 0 0;font-size:21px;font-weight:700;line-height:1.5;letter-spacing:-.01em}
.se{margin:0;font-family:var(--f-gsf);font-size:12.5px;color:rgba(255,255,255,.45)}
.lanes{margin-top:auto;display:flex;flex-direction:column;gap:14px;padding:16px 0 4px;border-top:1px dashed rgba(255,255,255,.14)}
.lane{display:flex;align-items:center;gap:6px;height:42px}
.lane .k{flex:none;width:60px;font-family:var(--f-gsf);font-weight:700;font-size:11px;letter-spacing:.08em;color:#F5D547}
.lane .k.ob{color:var(--pri-l)}
.seg{position:relative;flex:none;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:0 8px;font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;transform-origin:0 50%}
.seg::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 2px 12px rgba(255,255,255,.22);pointer-events:none}
.seg.gy{background:repeating-linear-gradient(-45deg,rgba(255,255,255,.08) 0 8px,rgba(255,255,255,.04) 8px 16px);color:rgba(255,255,255,.62)}
.seg.bad{background:linear-gradient(135deg,rgba(246,176,158,.45),rgba(239,112,79,.55));color:#fff}
.seg.bl{background:linear-gradient(164deg,#71CBF8,#1FACF4 39%,#0B97DE 71%);color:#fff}
.seg.bl::after{box-shadow:inset 0 2px 14px rgba(255,255,255,.55)}
.seg.gd{background:rgba(110,220,110,.2);color:#B6F0B4}
.mk{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;margin-left:4px}
.mk.x{background:linear-gradient(135deg,#F6B09E,#EF704F 40%,#EB4F27);box-shadow:0 0 16px rgba(239,112,79,.6)}
.mk.o{background:linear-gradient(135deg,#9ADAFA,#1FACF4);box-shadow:0 0 16px rgba(31,172,244,.6)}
.lane em{font-style:normal;font-weight:700;font-size:12.5px;white-space:nowrap}
.lane em.r{color:#FF9C80} .lane em.g{color:#9ADAFA}


/* chart marks */
.p{position:absolute;display:block;transform-origin:50% 50%}
.p img{width:100%;height:100%;display:block}
.p.barv{transform-origin:50% 100%}
.p.hero{z-index:2}
.halo{position:absolute;left:21%;top:2%;width:58%;aspect-ratio:1;border-radius:30%;border:3px solid #1FACF4;pointer-events:none}
/* lens: big UI */
#s12lens{background:#F3F5F8;padding-bottom:6vw}
.lhead{position:relative;width:100%}
.scene{margin-top:4vw;display:flex;flex-direction:column;align-items:flex-start}
.vbig{position:relative;width:100%;aspect-ratio:16/9.6;overflow:hidden;background:#0A2230}
.vbig video{width:100%;height:100%;object-fit:cover}
.vbig .live{left:20px;top:20px;font-size:12px}
.cap{margin:2.2vw 0 0 calc(40/1400*100vw);transform-origin:0 0;scale:1.25}
.cap img{width:100%}

@media (max-width:760px){.gl{display:none}.now{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>

<nav class="nav" id="nav" aria-label="섹션">
  <div class="groups" id="groups"><button class="lg" data-to="s01cover" aria-label="처음으로">{{LOGO}}</button></div>
  <div class="rt">
    <div class="now"><i id="nowi">01</i><span id="nowt">olways</span></div>
    <button class="go" id="go" aria-label="다음 섹션"><svg class="ring" viewBox="0 0 38 38"><circle cx="19" cy="19" r="18"/></svg><svg class="ar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>
</nav>

<main id="main">
{{SECTIONS}}
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const setK=()=>document.documentElement.style.setProperty('--k',(innerWidth/1400).toFixed(5));setK();addEventListener('resize',setK);
const secs=$$('#main > section');

/* nav */
const groups=[];secs.forEach(s=>{if(!groups.find(g=>g.name===s.dataset.g))groups.push({name:s.dataset.g,el:s})});
groups.forEach(g=>{const b=document.createElement('button');b.className='gl';b.textContent=g.name;b.onclick=()=>to(g.el);$('#groups').appendChild(b);g.btn=b});
const topOf=el=>el.getBoundingClientRect().top+scrollY;
const to=el=>window.scrollTo({top:topOf(el)-(el.id==='s01cover'?0:0),behavior:'smooth'});
$$('[data-to]').forEach(b=>b.onclick=()=>to(document.getElementById(b.dataset.to)));
let cur=-1,lastY=0;
function upd(){const y=scrollY,probe=y+innerHeight*.35;let i=0;secs.forEach((s,j)=>{if(topOf(s)<=probe)i=j});
  const np=y+32;let dk=false;secs.forEach(s=>{const t=topOf(s);if(t<=np&&t+s.offsetHeight>np&&s.classList.contains('dk'))dk=true});document.body.classList.toggle('dk',dk);
  if(i!==cur){cur=i;$('#nowt').textContent=secs[i].dataset.l;$('#nowi').textContent=String(i+1).padStart(2,'0');groups.forEach(g=>g.btn.classList.toggle('on',g.name===secs[i].dataset.g))}
  $('#go').style.setProperty('--prog',(y/(document.documentElement.scrollHeight-innerHeight)).toFixed(3));
  $('#nav').classList.toggle('hide',y>lastY+4&&y>200&&!navLock);if(y<lastY-4)$('#nav').classList.remove('hide');lastY=y;}
let navLock=false;
$('#go').onclick=()=>{navLock=true;setTimeout(()=>navLock=false,1200);to(secs[cur>=secs.length-1?0:cur+1])};
addEventListener('scroll',()=>requestAnimationFrame(upd),{passive:true});upd();

/* videos play only when visible */
const io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target;if(e.isIntersecting){v.play().catch(()=>{})}else v.pause()}),{threshold:.2});
$$('video').forEach(v=>io.observe(v));

/* spotlight cycling (anatomy / pass) */
$$('.spot').forEach(sp=>{const sec=sp.closest('section'),bd=[...sec.querySelectorAll('.bdg')],cr=[...sec.querySelectorAll('.cring')];let i=0,hold=0,vis=false;
  const r=()=>sp.getBoundingClientRect();
  function pick(k){i=k;const R=r(),B=bd[k].getBoundingClientRect();sp.style.setProperty('--sx',((B.left+B.width/2-R.left)/R.width*100)+'%');sp.style.setProperty('--sy',((B.top+B.height/2-R.top)/R.height*100)+'%');
    bd.forEach((b,j)=>b.classList.toggle('on',j===k));cr.forEach((c,j)=>c.classList.toggle('on',j===k))}
  bd.forEach((b,k)=>b.onclick=()=>{hold=performance.now()+8000;sp.classList.add('on');pick(k)});
  new IntersectionObserver(es=>es.forEach(e=>{vis=e.isIntersecting;if(vis){sp.classList.add('on');pick(0)}else{sp.classList.remove('on');cr.forEach(c=>c.classList.remove('on'))}}),{threshold:.55}).observe(sp);
  setInterval(()=>{if(vis&&performance.now()>hold)pick((i+1)%bd.length)},2600);});

/* idle → back to top */
let idle;const bump=()=>{clearTimeout(idle);idle=setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}),180000)};['pointerdown','wheel','touchstart','keydown'].forEach(e=>addEventListener(e,bump,{passive:true}));bump();

if(!window.gsap||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
gsap.registerPlugin(ScrollTrigger);ScrollTrigger.config({ignoreMobileResize:true});
const E='power3.out';

/* cover: photo settles in, logo rises; parallax on scroll */
gsap.from('#s01cover .cv',{scale:1.18,duration:2.2,ease:'power2.out'});
gsap.from('#s01cover .b',{y:60,opacity:0,duration:1.3,ease:E,stagger:.18,delay:.3});
gsap.to('#s01cover .cv',{yPercent:12,scale:1.06,ease:'none',scrollTrigger:{trigger:'#s01cover',start:'top top',end:'bottom top',scrub:true}});
gsap.to('#s01cover .b',{yPercent:-60,opacity:0,ease:'none',stagger:.05,scrollTrigger:{trigger:'#s01cover',start:'top top',end:'70% top',scrub:true}});


const ST=(el,start)=>({trigger:el,start:start||'top 88%',toggleActions:'play none none reverse'});
/* titles: open from the centre */
$$('.b.title').forEach(el=>gsap.fromTo(el,{clipPath:'inset(0 50% 0 50%)',opacity:0},{clipPath:'inset(0 0% 0 0%)',opacity:1,duration:1.1,ease:'power3.inOut',scrollTrigger:ST(el,'top 92%')}));
/* eyebrow tags pop */
$$('.b.tag').forEach(el=>gsap.fromTo(el,{y:16,opacity:0,scale:.85},{y:0,opacity:1,scale:1,duration:.7,ease:'back.out(2.2)',scrollTrigger:ST(el,'top 94%')}));
/* insights: dissolve, grow from the centre */
$$('.b.dissolve').forEach(el=>gsap.fromTo(el,{opacity:0,scale:.82,filter:'blur(10px)'},{opacity:1,scale:1,filter:'blur(0px)',duration:1.1,ease:'expo.out',scrollTrigger:ST(el,'top 85%')}));
/* flow diagram: drawn along the arrows */
$$('.b.draw').forEach(el=>gsap.fromTo(el,{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0% 0 0)',ease:'none',scrollTrigger:{trigger:el,start:'top 85%',end:'bottom 70%',scrub:.6}}));

/* per-section entrance for regular cards — every section moves differently */
const FROM={
  rise:el=>({y:70,opacity:0}),
  cascade:(el,i)=>({y:120,opacity:0,rotate:i%2?1.2:-1.2}),
  sides:el=>({x:el.dataset.side==='l'?-120:120,opacity:0}),
  slideblur:el=>({x:-90,opacity:0,filter:'blur(12px)'}),
  tilt:el=>({rotateX:28,y:80,opacity:0,transformPerspective:900,transformOrigin:'50% 100%'}),
  focus:el=>({scale:1.08,opacity:0,filter:'blur(14px)'}),
  flip:(el,i)=>({rotateY:-70,opacity:0,transformPerspective:1000,transformOrigin:'0% 50%'}),
  dissolve:el=>({scale:.85,opacity:0,filter:'blur(10px)'})
};
$$('main > section').forEach(sec=>{const mode=sec.dataset.anim;if(mode==='cover')return;
  const cards=[...sec.querySelectorAll(':scope > .b.std, :scope > .lhead > .b.std, :scope > .b.html, :scope > .b.lensb')];
  cards.forEach((el,i)=>{const f=FROM[mode]||FROM.rise;const fr=f(el,i);const to={x:0,y:0,rotate:0,rotateX:0,rotateY:0,scale:1,opacity:1,filter:'blur(0px)',duration:1.15,ease:'power3.out',delay:(i%3)*.08};
    if(el.classList.contains('lensb')){Object.assign(fr,{clipPath:'inset(8% 6% 8% 6% round 40px)',scale:1.06});to.clipPath='inset(0% 0% 0% 0% round 0px)';}
    const tl=gsap.timeline({scrollTrigger:ST(el,'top 90%')});tl.fromTo(el,fr,to,0);
    addParts(el,tl);});
});

/* chart marks inside a card */
function addParts(el,tl){const ps=[...el.querySelectorAll(':scope > .p')];if(!ps.length)return;
  const by=k=>ps.filter(p=>p.classList.contains(k));
  const bh=by('barh').sort((a,b)=>a.dataset.y-b.dataset.y),bv=by('barv').sort((a,b)=>a.dataset.x-b.dataset.x),po=by('pop').sort((a,b)=>a.dataset.x-b.dataset.x);
  gsap.set(ps,{opacity:0});
  bh.forEach((p,i)=>tl.fromTo(p,{opacity:1,clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0% 0 0)',duration:.9,ease:'power2.out'},.45+i*.16));
  bv.forEach((p,i)=>tl.fromTo(p,{opacity:1,clipPath:'inset(100% 0 0 0)'},{clipPath:'inset(0% 0 0 0)',duration:.95,ease:'power2.out'},.45+i*.14));
  po.forEach((p,i)=>tl.fromTo(p,{opacity:0,scale:0},{opacity:1,scale:1,duration:.8,ease:'back.out(1.8)'},.5+i*.14));
  /* positioning map: logos pop one after another, olways last */
  const lg=by('logo').sort(()=>Math.random()-.5);
  lg.forEach((p,i)=>tl.fromTo(p,{opacity:0,scale:.2,y:10},{opacity:1,scale:1,y:0,duration:.45,ease:'back.out(2.6)'},.6+i*.09));
  by('hero').forEach(p=>{const t0=.6+lg.length*.09+.35;tl.fromTo(p,{opacity:0,scale:0},{opacity:1,scale:1,duration:1,ease:'elastic.out(1,.55)'},t0);
    const ring=document.createElement('b');ring.className='halo';p.appendChild(ring);tl.fromTo(ring,{scale:.4,opacity:.9},{scale:1.8,opacity:0,duration:1.4,ease:'power2.out'},t0+.15)});
  /* scenario: step cards drop, then the curve is drawn and each moment appears as the line reaches it */
  const dr=by('drop').sort((a,b)=>a.dataset.x-b.dataset.x);dr.forEach((p,i)=>tl.fromTo(p,{opacity:0,y:-24},{opacity:1,y:0,duration:.5,ease:'power3.out'},.4+i*.08));
  const cv=by('curve')[0];if(cv){const c0=.4+dr.length*.08+.2,D=2.2,x0=+cv.dataset.x,w=parseFloat(cv.style.width)/100*el.offsetWidth/(el.offsetWidth/ (parseFloat(el.style.width)/100*1400))||1115;
    tl.fromTo(cv,{opacity:1,clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0% 0 0)',duration:D,ease:'none'},c0);
    by('dot').forEach(p=>{const f=Math.min(1,Math.max(0,(+p.dataset.x+12-x0)/1115));tl.fromTo(p,{opacity:0,scale:0},{opacity:1,scale:1,duration:.4,ease:'back.out(3)'},c0+f*D)});
    by('bubble').forEach(p=>{const f=Math.min(1,Math.max(0,(+p.dataset.x+86-x0)/1115));tl.fromTo(p,{opacity:0,scale:.6,y:14},{opacity:1,scale:1,y:0,duration:.5,ease:'back.out(2)'},c0+f*D+.1)});}
}

/* through the lens: UI videos break the grid and grow to full width */
$$('.vbig').forEach(v=>{gsap.fromTo(v,{clipPath:'inset(10% 9% 10% 9% round 48px)'},{clipPath:'inset(0% 0% 0% 0% round 0px)',ease:'none',scrollTrigger:{trigger:v,start:'top 100%',end:'center 50%',scrub:.6}});
  gsap.fromTo(v.querySelector('video'),{scale:1.25},{scale:1,ease:'none',scrollTrigger:{trigger:v,start:'top 100%',end:'center 50%',scrub:.6}});});
$$('.scene .cap').forEach(c=>gsap.fromTo(c,{y:50,opacity:0},{y:0,opacity:1,duration:1,ease:'power3.out',scrollTrigger:ST(c,'top 92%')}));
/* solution lanes grow left to right */
$$('.sol .lane').forEach(l=>gsap.fromTo(l.querySelectorAll('.seg,.mk,em'),{scaleX:0,opacity:0},{scaleX:1,opacity:1,stagger:.12,ease:'none',scrollTrigger:{trigger:l,start:'top 88%',end:'top 55%',scrub:.6}}));
/* data loop: ring turns in, nodes pop around it */
gsap.fromTo('#s15loop .ring',{rotate:-180,scale:.5,opacity:0},{rotate:0,scale:1,opacity:1,ease:'none',scrollTrigger:{trigger:'#s15loop .ring',start:'top 95%',end:'center 55%',scrub:.6}});
gsap.fromTo('#s15loop .node',{scale:0,opacity:0},{scale:1,opacity:1,stagger:.18,duration:.7,ease:'back.out(2.4)',scrollTrigger:ST('#s15loop .ring','top 65%')});
/* depth: plates drift slower than cards */
$$('section:not(#s01cover):not(#s12lens) > .plate').forEach(p=>gsap.fromTo(p,{yPercent:-3},{yPercent:3,ease:'none',scrollTrigger:{trigger:p.parentElement,start:'top bottom',end:'bottom top',scrub:true}}));
addEventListener('load',()=>ScrollTrigger.refresh());
})();
</script>

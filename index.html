<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>올웨이즈 전시 프로토타입</title>
<link rel="stylesheet" href="app.css?v=olw-cd6e72229f">
<style>
:root{--stage-bg:#000;color-scheme:dark}
html,body{margin:0;padding:0;background:var(--stage-bg);height:100%;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#stage{left:0;top:0}
@media (prefers-reduced-motion: reduce){.screen-layer *{animation-duration:.01ms!important}}
</style>
</head><body>
<div id="stage">
  <div id="bg" class="bg-layer"></div>
  <div id="ui" class="screen-layer"></div>
  <div id="progress"></div>
</div>
<div id="boot" style="display:none;position:fixed;inset:0;z-index:99;background:#0c0c0e;align-items:center;justify-content:center;flex-direction:column;gap:18px;font-family:-apple-system,system-ui,sans-serif;color:#fff"><div style="font-size:28px;font-weight:600;letter-spacing:.02em">올웨이즈</div><div style="width:min(420px,70vw);height:6px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden"><div id="bootbar" style="height:100%;width:0;background:#7cc4ff;transition:width .3s"></div></div><div id="boottx" style="font-size:15px;opacity:.75">전시 준비 중…</div></div><script>/* 주소창 숨기기 — 화면을 누르면 전체 화면으로 (아이패드 사파리). 안경 창은 트랙패드로 한 번 누르면 된다 */(function(){function fs(){var d=document,el=d.documentElement;if(d.fullscreenElement||d.webkitFullscreenElement)return;var r=el.requestFullscreen||el.webkitRequestFullscreen;if(!r)return;try{var p=r.call(el);p&&p.catch&&p.catch(function(){})}catch(e){}}addEventListener('pointerup',fs,true);addEventListener('touchend',fs,true);addEventListener('keydown',function(e){if(e.key==='f'||e.key==='F')fs()})})();</script><script src="boot.js?v=olw-cd6e72229f"></script>
</body></html>
